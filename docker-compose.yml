# Docker logs total <= 96 MB: 4 services x 3 files x 8 MB. Caddy logs to stdout only.
x-log: &log
  driver: json-file
  options: { max-size: "8m", max-file: "3" }

services:
  db:
    image: postgres:17.12-alpine
    restart: unless-stopped
    logging: *log
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  web:
    build: ./web
    restart: unless-stopped
    logging: *log
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTH_SECRET: ${AUTH_SECRET}
      BASE_URL: ${BASE_URL}
      SUPERADMIN_LOGIN: ${SUPERADMIN_LOGIN}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      TIMEZONE_NAME: ${TIMEZONE_NAME:-Europe/Moscow} # journal times
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/login >/dev/null"]
      interval: 10s
      retries: 30

  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    logging: *log
    depends_on:
      web:
        condition: service_healthy
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN:?set PANEL_DOMAIN in .env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  bot:
    build: ./bot
    restart: unless-stopped
    logging: *log
    depends_on:
      web:
        condition: service_healthy # tables exist only after the panel's migrations
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTH_SECRET: ${AUTH_SECRET} # decrypts the token and API data set in the panel (Настройки)
      PANEL_URL: ${PANEL_URL:-}
      TIMEZONE_NAME: ${TIMEZONE_NAME:-Europe/Moscow}
    tmpfs: [/tmp] # MTProto vault (members-*/) is never written to disk

volumes:
  db-data:
  caddy-data:
  caddy-config:
